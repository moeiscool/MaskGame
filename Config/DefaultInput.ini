[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bEnableMouseSmoothing=True
bUseMouseForTouch=False
bEnableGestureRecognizer=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Analogue stick tuning. The look sticks get a wider dead zone than the movement
; stick because a resting thumb drifting the camera is far more noticeable than
; the same drift nudging the character, and a mild exponent so small
; deflections aim precisely while large ones still whip the camera round.
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.20,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.20,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.5,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.5,bInvert=False))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.0,bInvert=False))

; ---------------------------------------------------------------------------
; Gameplay uses Enhanced Input actions created in the editor and bound by
; AMaskCharacter. The mappings below are the fallback bindings the runtime
; greybox ships with, so the project is playable on keyboard or a controller
; before any input asset is authored.
;
; Every action carries both a keyboard and a gamepad key. Where the two schemes
; disagree it is because a controller has fewer buttons than a keyboard has
; keys: the ocarina reuses the face buttons and the d-pad, which is safe because
; drawing it puts the character's own controls away. AMaskCharacter enforces
; that; see IsOcarinaDrawn there.
; ---------------------------------------------------------------------------

; Movement. The left stick feeds the same axes as WASD.
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Gamepad_LeftX)

; Looking. A mouse reports a delta and is applied straight through; a stick
; reports a held position and has to be turned into a rate, so the two go to
; different axes and different handlers.
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="TurnRate",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=1.000000,Key=Gamepad_RightY)

; Actions.
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="Attack",Key=LeftMouseButton)
+ActionMappings=(ActionName="Attack",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="FormAction",Key=LeftShift)
+ActionMappings=(ActionName="FormAction",Key=Gamepad_RightTrigger)
+ActionMappings=(ActionName="LockOn",Key=Q)
+ActionMappings=(ActionName="LockOn",Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="Ocarina",Key=Tab)
+ActionMappings=(ActionName="Ocarina",Key=Gamepad_FaceButton_Top)

; The five ocarina notes, live only while the ocarina is drawn.
+ActionMappings=(ActionName="NoteLeft",Key=Left)
+ActionMappings=(ActionName="NoteLeft",Key=Gamepad_DPad_Left)
+ActionMappings=(ActionName="NoteRight",Key=Right)
+ActionMappings=(ActionName="NoteRight",Key=Gamepad_DPad_Right)
+ActionMappings=(ActionName="NoteUp",Key=Up)
+ActionMappings=(ActionName="NoteUp",Key=Gamepad_DPad_Up)
+ActionMappings=(ActionName="NoteDown",Key=Down)
+ActionMappings=(ActionName="NoteDown",Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="NoteA",Key=SpaceBar)
+ActionMappings=(ActionName="NoteA",Key=Gamepad_FaceButton_Bottom)

; Mask quick-slots. The d-pad doubles as the note keys, which is why the
; ocarina suppresses them rather than the two fighting over a press.
+ActionMappings=(ActionName="MaskSlot1",Key=One)
+ActionMappings=(ActionName="MaskSlot1",Key=Gamepad_DPad_Up)
+ActionMappings=(ActionName="MaskSlot2",Key=Two)
+ActionMappings=(ActionName="MaskSlot2",Key=Gamepad_DPad_Right)
+ActionMappings=(ActionName="MaskSlot3",Key=Three)
+ActionMappings=(ActionName="MaskSlot3",Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="MaskSlot4",Key=Four)
+ActionMappings=(ActionName="MaskSlot4",Key=Gamepad_DPad_Left)
+ActionMappings=(ActionName="RemoveMask",Key=Zero)
+ActionMappings=(ActionName="RemoveMask",Key=Gamepad_Special_Left)
