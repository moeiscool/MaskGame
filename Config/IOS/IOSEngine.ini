; iOS and iPadOS platform settings, overriding Config/DefaultEngine.ini for
; Apple mobile builds only.

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; Change this before you publish. It must match the App ID in your Apple
; developer account, and it cannot be changed after release.
BundleIdentifier=com.maskgame.maskgame
BundleDisplayName=MaskGame
BundleName=MaskGame
VersionInfo=0.1.0

; Landscape both ways up, matching the touch layout.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True

; Metal only; the OpenGL path is long gone on iOS.
bSupportsMetal=True
bSupportsMetalMRT=False
MinimumiOSVersion=IOS_16

; A12 and later. Anything older cannot hold the frame rate.
bSupportsIPad=True
bSupportsIPhone=True
bEnableRemoteNotificationsSupport=False

[/Script/Engine.RendererSettings]
; Same reasoning as Android: the mobile renderer, one movable sun, nothing baked.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AllowDistanceFieldShadows=False
r.AllowStaticLighting=False
r.MobileHDR=True

[/Script/EngineSettings.GameMapsSettings]
bUseSplitscreen=False
