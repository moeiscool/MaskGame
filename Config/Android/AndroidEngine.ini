; Android platform settings. These override Config/DefaultEngine.ini for Android
; builds only; the desktop settings are untouched.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Change this before you publish anything. It is the app's permanent identity on
; a device and in the Play Store, and it cannot be changed after release.
PackageName=com.maskgame.maskgame
ApplicationDisplayName=MaskGame
StoreVersion=1
VersionDisplayName=0.1.0

; API 26 is the floor for the Vulkan path and covers everything from 2017 on.
MinSDKVersion=26
TargetSDKVersion=34

; Landscape, because the touch layout puts a thumb in each bottom corner and the
; action cluster needs the width. Sensor landscape so it flips either way up.
Orientation=SensorLandscape
bFullScreen=True
bAndroidVoiceEnabled=False

; arm64 only. Every Android device that can run this is 64-bit, and dropping the
; other slices roughly halves the APK.
bBuildForArm64=True
bBuildForX8664=False
bBuildForES31=True
bSupportsVulkan=True
bSupportsVulkanSM5=False

bPackageDataInsideApk=True
bEnableGooglePlaySupport=False
bUseExternalFilesDir=False
AndroidGraphicsDebugger=None

[/Script/Engine.RendererSettings]
; Lumen and virtual shadow maps are desktop features; on a phone they either do
; nothing or cost far too much. The mobile renderer wants the older path.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.EnableNoPrecomputedLightingCSMShader=True
; The game drives one movable directional light through the whole cycle, so
; nothing here can be baked.
r.AllowStaticLighting=False
r.MobileHDR=True

[/Script/Engine.GarbageCollectionSettings]
; The greybox rebuilds the world on every rewind, which is a burst of ~100 actor
; destructions. A slightly more eager collector keeps that off the frame budget.
gc.TimeBetweenPurgingPendingKillObjects=30

[/Script/EngineSettings.GameMapsSettings]
; One screen, one pair of thumbs.
bUseSplitscreen=False
